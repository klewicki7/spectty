[package]
name = "spectty-core"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# QUARANTINE: spectty-core depends INWARD ONLY. These two crates are the entire
# allowed dependency surface. No serde_json, no tokio, no anyhow, no tauri, no
# adapters. The dependency list itself is the PRIMARY hexagonal boundary gate.
[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }

# TEST-ONLY: serde_json is a dev-dependency exclusively so Core's serde round-trip
# tests have a concrete wire format. It is NOT a runtime dependency — the library
# itself still depends INWARD ONLY on serde + thiserror, so the hexagonal quarantine
# holds and `cargo deny ... check bans` stays green (it bans tauri/tokio/reqwest).
[dev-dependencies]
serde_json = { workspace = true }
