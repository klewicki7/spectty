[package]
name = "spectty-adapters"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# Adapters depend on the core plus serialization/error helpers. NO tauri, NO
# reqwest (real engram HTTP transport is M3). portable-pty (M1) lives here — the
# real PTY backend belongs to the adapter layer, never to spectty-core.
[dependencies]
spectty-core = { workspace = true }
# `preserve_order` backs `serde_json::Value` with `indexmap` so the JSON
# namespace editor (provision/json_namespace.rs) keeps the user's existing
# `~/.claude.json` keys in their ORIGINAL order instead of re-sorting them
# alphabetically. This feature is scoped to the ADAPTERS crate ONLY — Core
# depends on serde_json as a DEV-dependency exclusively, so neither serde_json
# nor indexmap ever enters Core's runtime (`-e normal`) graph; the hexagonal
# quarantine and `cargo deny ... check bans` stay green.
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
anyhow = { workspace = true }
thiserror = { workspace = true }
portable-pty = "0.9.0"
# M4 (PR-1, D26): the real engram HTTP transport. `EngramAdapter` owns a dedicated
# Tokio runtime and `block_on`-bridges the SYNC `PersistencePort` to async reqwest.
# These stay in ADAPTERS only — Core's `cargo deny ... check bans` quarantine forbids
# them in `crates/core` and remains green.
tokio = { workspace = true }
reqwest = { workspace = true }
