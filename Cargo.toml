[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/adapters",
    "crates/spectty-mcp",
    "crates/spectty-hook",
    "src-tauri",
]

[workspace.package]
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
spectty-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
# M4 (PR-1): the real engram HTTP transport lives in the ADAPTERS crate only
# (EngramAdapter bridges the sync PersistencePort to async reqwest via a dedicated
# Tokio runtime, D26). Core NEVER gains these — the hexagonal quarantine stays green.
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
# M4 (PR-4, D35): the file-system watcher behind `FileWatchPort` lives in ADAPTERS only.
# Core NEVER gains `notify` — the hexagonal quarantine (`cargo deny check bans`) stays green.
notify = "6"
