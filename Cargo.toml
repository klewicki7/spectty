[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/adapters",
    "crates/spectty-mcp",
    "crates/spectty-hook",
    "src-tauri",
]

[workspace.package]
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
spectty-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
