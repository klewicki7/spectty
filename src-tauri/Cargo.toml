[package]
name = "spectty"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# The src-tauri bridge is the ONLY crate allowed to depend on tauri. It wires the
# technology-agnostic core (spectty-core) and its adapters (spectty-adapters) to
# the Tauri runtime. The hexagonal boundary lives upstream: core/adapters never
# see this dependency surface.

[lib]
# Tauri v2 splits the entrypoint into a library (app logic, mobile-shareable) and
# a thin binary. `name` must be a valid identifier, hence the underscore.
name = "spectty_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
spectty-core = { workspace = true }
spectty-adapters = { path = "../crates/adapters" }
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { workspace = true }
# portable-pty lives here too (not just adapters): the read-thread/Channel wiring
# and the real-PTY integration test drive PtyAdapter against an actual pty. Core
# stays clean — this dependency never reaches spectty-core.
portable-pty = "0.9.0"

[dev-dependencies]
# WU-9 path-agreement integration test: calls spectty_hook::spectty_runtime_dir()
# alongside spectty_lib::spectty_runtime_dir() in ONE test. A test-only dep on the
# thin [lib] target of spectty-hook (serde/serde_json only — no tauri, no core).
# This makes D25 path divergence IMPOSSIBLE to land undetected.
spectty-hook = { path = "../crates/spectty-hook" }
# serde_json used in integration tests to parse the state file written by the
# spectty-hook binary.
serde_json = { workspace = true }
